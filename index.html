<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07060d">
<title>Лунная лаборатория · интерактивная 3D-модель</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#07060d;color:#f2e9dc;
 font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 -webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;top:calc(10px + env(safe-area-inset-top));left:14px;right:14px;z-index:3;
 display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.brand{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#c9a86a}
.mode{font-size:10.5px;color:#8d8298;text-align:right;line-height:1.4}
.wm{position:fixed;right:12px;top:calc(42px + env(safe-area-inset-top));z-index:3;
 background:rgba(16,14,24,.6);border:1px solid rgba(201,168,106,.22);border-radius:10px;
 padding:5px 9px;font-size:10.5px;color:#9a8fa6;backdrop-filter:blur(10px);
 -webkit-backdrop-filter:blur(10px);max-width:58vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wm b{color:#c9a86a}
.panel{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:3;
 background:rgba(16,14,24,.74);border:1px solid rgba(201,168,106,.22);border-radius:20px;
 padding:12px 13px 13px;backdrop-filter:blur(20px) saturate(1.25);
 -webkit-backdrop-filter:blur(20px) saturate(1.25);box-shadow:0 12px 44px rgba(0,0,0,.55)}
.pname{font-size:21px;font-weight:650;letter-spacing:-.3px;color:#f6e7c8;margin:0}
.facts{display:flex;gap:11px;font-size:11.5px;color:#9a8fa6;margin:3px 0 6px;flex-wrap:wrap}
.facts b{color:#c9a86a;font-weight:600}
.expl{font-size:13px;color:#cdc2d4;margin:0 0 8px;min-height:54px}
input[type=range]{-webkit-appearance:none;width:100%;height:30px;background:transparent;margin:0;display:block}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;
 background:linear-gradient(90deg,#2a2438,#6b5a3e,#c9a86a,#6b5a3e,#2a2438)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;
 border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff8e8,#d9b877);
 border:1px solid #8a7343;box-shadow:0 2px 10px rgba(0,0,0,.55)}
.row{display:flex;gap:7px;margin-top:7px}
button{flex:1;border:1px solid rgba(201,168,106,.28);background:rgba(255,248,232,.06);
 color:#e8dcc6;font:600 13px/1.1 inherit;padding:11px 5px;border-radius:12px;transition:.14s}
button:active{transform:scale(.955);background:rgba(201,168,106,.2)}
button.on{background:linear-gradient(180deg,#d3ac6c,#b08d4e);color:#1a1420;border-color:#d3ac6c}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px}
.chips button{font-size:10px;padding:8px 2px;line-height:1.15}
.hint{font-size:10.5px;color:#7d7389;text-align:center;margin:8px 0 0}
.tools{display:flex;gap:7px;margin-top:7px}
.tools button{font-size:11px;padding:9px 4px}
#boot{position:fixed;inset:0;z-index:9;background:#07060d;display:flex;align-items:center;
 justify-content:center;flex-direction:column;gap:15px;transition:opacity .6s;padding:30px;text-align:center}
#boot .t{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:#c9a86a}
#boot .bar{width:170px;height:2px;background:#241f30;border-radius:2px;overflow:hidden}
#boot .fill{height:100%;width:0;background:linear-gradient(90deg,#8a7343,#e8cf9a);transition:width .25s}
#boot .err{font-size:13px;color:#d8a0a0;max-width:320px;line-height:1.5;display:none}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="top">
  <div class="brand">Лунная лаборатория</div>
  <div class="mode" id="mode">Орбита<br><span style="opacity:.6">облёт пальцем</span></div>
</div>
<div class="wm" id="wm"></div>

<div class="panel">
  <p class="pname" id="pname">—</p>
  <div class="facts"><span>День <b id="fday">—</b></span><span>Освещено <b id="flit">—</b></span><span>Цикл <b>29,5 сут</b></span></div>
  <p class="expl" id="pexp">—</p>
  <input type="range" id="sl" min="0" max="360" step="0.2" value="120" aria-label="Положение Луны на орбите">
  <div class="row">
    <button id="play">▶ Пуск</button>
    <button id="spd">1×</button>
    <button id="cam">С Земли</button>
    <button id="exp">Разобрать</button>
  </div>
  <div class="chips" id="chips"></div>
  <p class="hint">Один палец — облёт · два — зум · двойной тап — вид с Земли</p>
  <div class="tools">
    <button id="dl">⤓ Скачать офлайн-версию</button>
    <button id="q">Качество: авто</button>
  </div>
</div>

<div id="boot">
  <div class="t" id="bt">Загружаем движок</div>
  <div class="bar"><div class="fill" id="bf"></div></div>
  <div class="err" id="be"></div>
</div>

<script>
/* ══════════ НАСТРОЙКИ ПОКУПАТЕЛЯ ══════════ */
const CONFIG = {
  teacherName : "Имя Репетитора",
  teacherTag  : "астрономия · 5–9 класс",
  showMark    : true,        // false → скрыть знак (лицензия Studio)
  cycleSec    : 26,          // полный оборот, сек
  jumpMs      : 700,         // перелёт к фазе, мс
  speeds      : [1, 2, 0.5],
  quality     : "auto"       // "high" | "low" | "auto"
};
/* ══════════════════════════════════════════ */

const TAU=Math.PI*2, D2R=Math.PI/180, MONTH=29.53;
const PHASES=[
 {a:0,  s:"Новолуние",        t:"Луна между Землёй и Солнцем. Свет падает на дальнюю сторону — с Земли диск не виден. Тёмный силуэт чуть подсвечен отражением самой Земли: это пепельный свет."},
 {a:45, s:"Растущий серп",    t:"Прошло несколько дней. Справа проступил тонкий освещённый край. Он прибывает каждый вечер — Луна «растёт»."},
 {a:90, s:"Первая четверть",  t:"Пройдена четверть орбиты. Видна ровно половина диска — правая. Вдоль границы света и тени кратеры отбрасывают длинные тени."},
 {a:135,s:"Растущая Луна",    t:"Освещено больше половины. Светлая часть наступает справа, тёмная отступает влево."},
 {a:180,s:"Полнолуние",       t:"Земля между Солнцем и Луной. Мы видим весь освещённый диск. Тени почти исчезают — рельеф кажется плоским, зато ярче всего видны светлые лучи вокруг кратеров."},
 {a:225,s:"Убывающая Луна",   t:"После полнолуния свет уходит: темнота наступает справа, освещённым остаётся левый бок."},
 {a:270,s:"Последняя четверть",t:"Три четверти пути. Снова половина диска, но теперь светлая — левая. Такую Луну видно утром."},
 {a:315,s:"Убывающий серп",   t:"Остался тонкий серп слева. Скоро цикл замкнётся — 29,5 суток от новолуния до новолуния."}
];

const $=id=>document.getElementById(id);
const bf=$('bf'), bt=$('bt'), be=$('be');
$('wm').innerHTML = CONFIG.showMark ? 'Модель: <b>'+CONFIG.teacherName+'</b> · '+CONFIG.teacherTag : '';
if(!CONFIG.showMark) $('wm').style.display='none';

/* ── загрузка Three.js: CDN → кэш → запасной CDN ── */
const CDNS=[
 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
 'https://unpkg.com/three@0.160.0/build/three.min.js',
 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js'
];
async function loadThree(){
 for(let i=0;i<CDNS.length;i++){
  try{
   const r=await fetch(CDNS[i],{mode:'cors'});
   if(!r.ok) throw 0;
   const txt=await r.text();
   if(txt.length<100000) throw 0;
   try{ localStorage.setItem('three_src',txt); }catch(e){}
   window.__THREE_SRC__=txt;
   const s=document.createElement('script'); s.textContent=txt; document.head.appendChild(s);
   if(window.THREE) return true;
  }catch(e){ bf.style.width=(10+i*8)+'%'; }
 }
 try{
  const cached=localStorage.getItem('three_src');
  if(cached){ const s=document.createElement('script'); s.textContent=cached; document.head.appendChild(s);
   window.__THREE_SRC__=cached; if(window.THREE) return true; }
 }catch(e){}
 return false;
}

/* ── утилиты шума ── */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
 t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash3(x,y,z){let h=x*374761393+y*668265263+z*1274126177;h=(h^(h>>>13))*1274126177;
 return((h^(h>>>16))>>>0)/4294967296;}
function noise3(x,y,z){
 const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi;
 const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf),L=(a,b,t)=>a+(b-a)*t;
 return L(L(L(hash3(xi,yi,zi),hash3(xi+1,yi,zi),u),L(hash3(xi,yi+1,zi),hash3(xi+1,yi+1,zi),u),v),
          L(L(hash3(xi,yi,zi+1),hash3(xi+1,yi,zi+1),u),L(hash3(xi,yi+1,zi+1),hash3(xi+1,yi+1,zi+1),u),v),w);
}
function fbm(x,y,z,o){let s=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*noise3(x*f,y*f,z*f);n+=a;a*=.5;f*=2.03;}return s/n;}

/* ── текстуры ── */
function moonTextures(size){
 const rnd=mulberry(20261119);
 const maria=[],craters=[],rays=[];
 for(let i=0;i<10;i++){const th=rnd()*TAU,ph=Math.acos(2*rnd()-1);
  maria.push({x:Math.sin(ph)*Math.cos(th),y:Math.cos(ph),z:Math.sin(ph)*Math.sin(th),r:.18+rnd()*.30,k:.5+rnd()*.4});}
 const NC=size>=1024?260:150;
 for(let i=0;i<NC;i++){const th=rnd()*TAU,ph=Math.acos(2*rnd()-1);
  craters.push({x:Math.sin(ph)*Math.cos(th),y:Math.cos(ph),z:Math.sin(ph)*Math.sin(th),
   r:Math.pow(rnd(),2.7)*.10+.006,d:.35+rnd()*.7});}
 for(let i=0;i<3;i++){const th=rnd()*TAU,ph=Math.acos(2*rnd()-1);
  rays.push({x:Math.sin(ph)*Math.cos(th),y:Math.cos(ph),z:Math.sin(ph)*Math.sin(th),
   n:12+((rnd()*10)|0),len:.3+rnd()*.45,seed:rnd()*100});}
 const alb=document.createElement('canvas');alb.width=size*2;alb.height=size;
 const ac=alb.getContext('2d'),ai=ac.createImageData(size*2,size),ad=ai.data;
 const bmp=document.createElement('canvas');bmp.width=size*2;bmp.height=size;
 const bc=bmp.getContext('2d'),bi=bc.createImageData(size*2,size),bd=bi.data;
 const W=size*2,H=size;
 for(let py=0;py<H;py++){
  const lat=(0.5-(py+.5)/H)*Math.PI, cl=Math.cos(lat), sl=Math.sin(lat);
  for(let px=0;px<W;px++){
   const lon=((px+.5)/W)*TAU-Math.PI;
   const nx=cl*Math.cos(lon), ny=sl, nz=cl*Math.sin(lon);
   let a=.5+fbm(nx*3.2+11,ny*3.2+7,nz*3.2+3,5)*.5;
   for(const M of maria){
    const dot=nx*M.x+ny*M.y+nz*M.z, ang=Math.acos(Math.max(-1,Math.min(1,dot)));
    if(ang<M.r){const f=1-ang/M.r;a-=(f*f*(3-2*f))*M.k*.30;}
   }
   let h=0;
   for(const C of craters){
    const dot=nx*C.x+ny*C.y+nz*C.z;
    if(dot<1-C.r*C.r*1.7) continue;
    const ang=Math.acos(Math.max(-1,Math.min(1,dot))), q=ang/C.r;
    if(q<1.35){
     if(q<.86){h-=C.d*(1-q*q)*.5;a-=C.d*.05;}
     else if(q<1.06){h+=C.d*.8*(1-Math.abs(q-.96)/.10);a+=C.d*.08;}
     else h+=C.d*.15*(1.35-q)/.29;
    }
   }
   for(const R of rays){
    const dot=nx*R.x+ny*R.y+nz*R.z, ang=Math.acos(Math.max(-1,Math.min(1,dot)));
    if(ang<R.len&&ang>.02){
     const ax=Math.atan2(ny-R.y,nx-R.x)+R.seed;
     a+=Math.pow(Math.abs(Math.cos(ax*R.n*.5)),14)*(1-ang/R.len)*.22;
    }
   }
   a=Math.max(.14,Math.min(1.05,a));
   const i=(py*W+px)*4, base=a*238;
   ad[i]=Math.min(255,base*1.02); ad[i+1]=Math.min(255,base*.985);
   ad[i+2]=Math.min(255,base*.93); ad[i+3]=255;
   const hv=Math.max(0,Math.min(255,128+h*150));
   bd[i]=bd[i+1]=bd[i+2]=hv; bd[i+3]=255;
  }
 }
 ac.putImageData(ai,0,0); bc.putImageData(bi,0,0);
 return {map:alb,bump:bmp};
}

function earthTextures(size){
 const W=size*2,H=size;
 const day=document.createElement('canvas');day.width=W;day.height=H;
 const dc=day.getContext('2d'),di=dc.createImageData(W,H),dd=di.data;
 const night=document.createElement('canvas');night.width=W;night.height=H;
 const nc=night.getContext('2d'),ni=nc.createImageData(W,H),nd=ni.data;
 const spec=document.createElement('canvas');spec.width=W;spec.height=H;
 const sc=spec.getContext('2d'),si=sc.createImageData(W,H),sd=si.data;
 const cloud=document.createElement('canvas');cloud.width=W;cloud.height=H;
 const cc=cloud.getContext('2d'),ci=cc.createImageData(W,H),cd=ci.data;
 const rnd=mulberry(90210);
 for(let py=0;py<H;py++){
  const lat=(0.5-(py+.5)/H)*Math.PI, cl=Math.cos(lat), sl=Math.sin(lat);
  for(let px=0;px<W;px++){
   const lon=((px+.5)/W)*TAU-Math.PI;
   const nx=cl*Math.cos(lon), ny=sl, nz=cl*Math.sin(lon);
   const cont=fbm(nx*1.9+31,ny*1.9+17,nz*1.9+5,6);
   const detail=fbm(nx*7+3,ny*7+9,nz*7+13,4);
   const land=cont+detail*.12 > .545;
   const ice=Math.abs(lat)>1.16;
   const i=(py*W+px)*4;
   let r,g,b;
   if(ice){ r=232;g=238;b=244; }
   else if(land){
    const arid=Math.max(0,1-Math.abs(lat)*2.1)*detail;
    const green=Math.max(0,Math.min(1,(cont-.5)*4));
    r=58+arid*120-green*18; g=92+green*46-arid*22; b=48+arid*40;
    if(Math.abs(lat)>0.95){r+=40;g+=38;b+=34;}
   } else {
    const deep=Math.max(0,Math.min(1,(.545-cont)*3.4));
    r=12+ (1-deep)*26; g=44+(1-deep)*62; b=86+(1-deep)*72;
   }
   dd[i]=r;dd[i+1]=g;dd[i+2]=b;dd[i+3]=255;
   const sv=land?(ice?90:22):205;
   sd[i]=sd[i+1]=sd[i+2]=sv;sd[i+3]=255;
   let lr=0,lg=0,lb=0;
   if(land&&!ice&&Math.abs(lat)<1.0&&rnd()<0.030*Math.max(0,1-Math.abs(lat))){
    const k=.5+rnd()*.5; lr=255*k;lg=196*k;lb=118*k;
   }
   nd[i]=lr;nd[i+1]=lg;nd[i+2]=lb;nd[i+3]=255;
   const cv=fbm(nx*3.4+77,ny*3.4+41,nz*3.4+23,5);
   const band=0.5+0.22*Math.sin(lat*5.5);
   const ca=Math.max(0,Math.min(1,(cv-band)*3.6));
   cd[i]=cd[i+1]=cd[i+2]=255; cd[i+3]=Math.round(ca*225);
  }
 }
 dc.putImageData(di,0,0);nc.putImageData(ni,0,0);sc.putImageData(si,0,0);cc.putImageData(ci,0,0);
 return {day,night,spec,cloud};
}

function envTexture(THREE,renderer){
 const c=document.createElement('canvas');c.width=512;c.height=256;
 const x=c.getContext('2d');
 const g=x.createLinearGradient(0,0,0,256);
 g.addColorStop(0,'#1a1730');g.addColorStop(.45,'#0d0b18');g.addColorStop(1,'#05040a');
 x.fillStyle=g;x.fillRect(0,0,512,256);
 const soft=(cx,cy,r,col,a)=>{const rg=x.createRadialGradient(cx,cy,0,cx,cy,r);
  rg.addColorStop(0,'rgba('+col+','+a+')');rg.addColorStop(1,'rgba('+col+',0)');
  x.fillStyle=rg;x.beginPath();x.arc(cx,cy,r,0,TAU);x.fill();};
 soft(90,70,150,'255,226,178',.95);
 soft(400,60,120,'150,180,255',.30);
 soft(250,200,180,'120,100,160',.18);
 const rnd=mulberry(5150);
 for(let i=0;i<400;i++){x.fillStyle='rgba(255,248,235,'+(.15+rnd()*.7)+')';
  x.beginPath();x.arc(rnd()*512,rnd()*256,rnd()*1.1+.2,0,TAU);x.fill();}
 const t=new THREE.CanvasTexture(c);
 t.mapping=THREE.EquirectangularReflectionMapping;
 t.colorSpace=THREE.SRGBColorSpace;
 const pm=new THREE.PMREMGenerator(renderer);
 const env=pm.fromEquirectangular(t).texture;
 pm.dispose();t.dispose();
 return env;
}

/* ── шейдеры постобработки ── */
const VS=`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`;
const FS_BRIGHT=`
uniform sampler2D tDiffuse;uniform float threshold;varying vec2 vUv;
void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;
 float l=dot(c,vec3(.2126,.7152,.0722));
 float k=smoothstep(threshold,threshold+.55,l);
 gl_FragColor=vec4(c*k,1.);}`;
const FS_BLUR=`
uniform sampler2D tDiffuse;uniform vec2 dir;varying vec2 vUv;
void main(){vec3 s=vec3(0.);
 s+=texture2D(tDiffuse,vUv-dir*4.).rgb*.051;
 s+=texture2D(tDiffuse,vUv-dir*3.).rgb*.0918;
 s+=texture2D(tDiffuse,vUv-dir*2.).rgb*.1231;
 s+=texture2D(tDiffuse,vUv-dir).rgb*.1552;
 s+=texture2D(tDiffuse,vUv).rgb*.1598;
 s+=texture2D(tDiffuse,vUv+dir).rgb*.1552;
 s+=texture2D(tDiffuse,vUv+dir*2.).rgb*.1231;
 s+=texture2D(tDiffuse,vUv+dir*3.).rgb*.0918;
 s+=texture2D(tDiffuse,vUv+dir*4.).rgb*.051;
 gl_FragColor=vec4(s,1.);}`;
const FS_COMP=`
uniform sampler2D tScene,tBloom,tDepth;
uniform vec2 res;uniform float time,grain,vignette,chroma,bloomK,dofK,focus,near,far;
varying vec2 vUv;
float lin(float d){float z=d*2.-1.;return (2.*near*far)/(far+near-z*(far-near));}
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
void main(){
 vec2 uv=vUv, d=uv-.5;
 float r2=dot(d,d);
 vec2 off=d*chroma*r2;
 vec3 col;
 col.r=texture2D(tScene,uv+off).r;
 col.g=texture2D(tScene,uv).g;
 col.b=texture2D(tScene,uv-off).b;
 float depth=lin(texture2D(tDepth,uv).x);
 float coc=clamp(abs(depth-focus)/max(focus,1.)*dofK,0.,1.);
 if(coc>.02){
  vec3 bl=vec3(0.);float tot=0.;
  for(int i=0;i<12;i++){
   float a=float(i)*2.399963;
   float rr=sqrt((float(i)+.5)/12.)*coc*0.022;
   vec2 o=vec2(cos(a),sin(a))*rr*vec2(res.y/res.x,1.);
   bl+=texture2D(tScene,uv+o).rgb;tot+=1.;
  }
  col=mix(col,bl/tot,coc);
 }
 col+=texture2D(tBloom,uv).rgb*bloomK;
 col=aces(col*1.06);
 col*=1.-vignette*smoothstep(.15,.85,r2*1.9);
 float n=fract(sin(dot(uv*res+time,vec2(12.9898,78.233)))*43758.5453);
 col+=(n-.5)*grain;
 col=pow(max(col,0.),vec3(1./2.2));
 gl_FragColor=vec4(col,1.);
}`;

/* ── состояние ── */
let renderer,scene,camera,composer,rtScene,rtA,rtB,quad,quadCam,matBright,matBlur,matComp;
let moon,earth,clouds,atmo,ring,base,stand,sunMesh,sunGlow,stars,horizonGroup;
let angle=120,playing=false,si=0,last=0,tween=null;
let view=0,viewT=0,explode=0,explodeT=0;
let camTheta=-0.55,camPhi=1.05,camDist=13.5;
let LOW=false,QMODE='auto',W=1,H=1,DPR=1;
const SUN_DIR=new THREE.Vector3(-1,0.10,0.18).normalize();

/* ── сборка сцены ── */
function build(){
 const T=THREE;
 const canvas=$('stage');
 renderer=new T.WebGLRenderer({canvas,antialias:!LOW,alpha:false,powerPreference:'high-performance'});
 renderer.setPixelRatio(DPR);
 renderer.setSize(W,H,false);
 renderer.outputColorSpace=T.SRGBColorSpace;
 renderer.toneMapping=T.NoToneMapping;
 renderer.shadowMap.enabled=!LOW;
 renderer.shadowMap.type=T.PCFSoftShadowMap;

 scene=new T.Scene();
 scene.background=new T.Color(0x07060d);
 scene.fog=new T.FogExp2(0x07060d,0.012);
 camera=new T.PerspectiveCamera(42,W/H,0.1,400);

 const env=envTexture(T,renderer);
 scene.environment=env;

 // свет
 const sun=new T.DirectionalLight(0xfff0d4,3.4);
 sun.position.copy(SUN_DIR).multiplyScalar(40);
 if(!LOW){sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
  const c=sun.shadow.camera;c.left=-14;c.right=14;c.top=14;c.bottom=-14;c.near=1;c.far=90;
  sun.shadow.bias=-0.0012;}
 scene.add(sun);
 scene.add(new T.AmbientLight(0x2a2740,0.35));
 const rim=new T.PointLight(0x8fb4ff,0.55,60);rim.position.set(10,6,-12);scene.add(rim);

 // звёзды
 const sg=new T.BufferGeometry(),N=LOW?900:2000,pos=new Float32Array(N*3),col=new Float32Array(N*3);
 const rnd=mulberry(31337);
 for(let i=0;i<N;i++){
  const th=rnd()*TAU,ph=Math.acos(2*rnd()-1),r=90+rnd()*90;
  pos[i*3]=r*Math.sin(ph)*Math.cos(th);pos[i*3+1]=r*Math.cos(ph);pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
  const w=.4+rnd()*.6,tint=rnd();
  col[i*3]=w*(tint<.15?1:.96);col[i*3+1]=w*.95;col[i*3+2]=w*(tint>.8?1:.9);
 }
 sg.setAttribute('position',new T.BufferAttribute(pos,3));
 sg.setAttribute('color',new T.BufferAttribute(col,3));
 stars=new T.Points(sg,new T.PointsMaterial({size:.55,sizeAttenuation:true,vertexColors:true,
  transparent:true,opacity:.9,depthWrite:false}));
 scene.add(stars);

 // подставка
 const metal=new T.MeshStandardMaterial({color:0x1b1826,metalness:.92,roughness:.34,envMapIntensity:1.1});
 const gold=new T.MeshStandardMaterial({color:0xc9a86a,metalness:1,roughness:.22,envMapIntensity:1.5,
  emissive:0x3a2c12,emissiveIntensity:.35});
 base=new T.Group();
 const disc=new T.Mesh(new T.CylinderGeometry(6.4,6.7,.42,LOW?48:96,1),metal);
 disc.position.y=-3.2;disc.receiveShadow=true;base.add(disc);
 const bevel=new T.Mesh(new T.TorusGeometry(6.42,.055,8,LOW?64:128),gold);
 bevel.rotation.x=Math.PI/2;bevel.position.y=-2.99;base.add(bevel);
 const inner=new T.Mesh(new T.TorusGeometry(5.2,.02,6,LOW?64:128),gold);
 inner.rotation.x=Math.PI/2;inner.position.y=-2.97;base.add(inner);
 // гравировка шкалы
 for(let i=0;i<60;i++){
  const a=i/60*TAU,long=i%5===0;
  const tick=new T.Mesh(new T.BoxGeometry(long?.20:.10,.012,long?.045:.028),gold);
  tick.position.set(Math.cos(a)*5.8,-2.975,Math.sin(a)*5.8);
  tick.rotation.y=-a;base.add(tick);
 }
 scene.add(base);

 // стойка
 stand=new T.Group();
 const rod=new T.Mesh(new T.CylinderGeometry(.075,.10,3.0,16),metal);
 rod.position.y=-1.6;rod.castShadow=!LOW;stand.add(rod);
 const collar=new T.Mesh(new T.CylinderGeometry(.20,.20,.12,20),gold);
 collar.position.y=-.15;stand.add(collar);
 scene.add(stand);

 // Земля
 const et=earthTextures(LOW?256:512);
 const mk=(cv,srgb)=>{const t=new T.CanvasTexture(cv);
  if(srgb)t.colorSpace=T.SRGBColorSpace;t.anisotropy=LOW?2:4;return t;};
 const eMat=new T.MeshStandardMaterial({
  map:mk(et.day,true),roughnessMap:mk(et.spec,false),roughness:1,metalness:.05,
  emissiveMap:mk(et.night,true),emissive:0xffffff,emissiveIntensity:1.5,envMapIntensity:.35});
 // ночные огни только на теневой стороне
 eMat.onBeforeCompile=sh=>{
  sh.uniforms.sunDirW={value:SUN_DIR};
  sh.fragmentShader=sh.fragmentShader
   .replace('#include <common>','#include <common>\nuniform vec3 sunDirW;')
   .replace('#include <emissivemap_fragment>',
    `#include <emissivemap_fragment>
     float ndl=dot(normalize(vNormalW),normalize(sunDirW));
     totalEmissiveRadiance*=smoothstep(0.12,-0.22,ndl);`);
  sh.vertexShader=sh.vertexShader
   .replace('#include <common>','#include <common>\nvarying vec3 vNormalW;')
   .replace('#include <beginnormal_vertex>','#include <beginnormal_vertex>\nvNormalW=normalize(mat3(modelMatrix)*objectNormal);');
  sh.fragmentShader=sh.fragmentShader.replace('varying vec3 vNormalW;','');
  sh.fragmentShader='varying vec3 vNormalW;\n'+sh.fragmentShader;
 };
 earth=new T.Mesh(new T.SphereGeometry(1.55,LOW?48:96,LOW?32:64),eMat);
 earth.castShadow=!LOW;earth.receiveShadow=!LOW;
 scene.add(earth);

 clouds=new T.Mesh(new T.SphereGeometry(1.585,LOW?40:72,LOW?26:48),
  new T.MeshStandardMaterial({map:mk(et.cloud,true),transparent:true,opacity:.62,
   roughness:1,metalness:0,depthWrite:false}));
 scene.add(clouds);

 atmo=new T.Mesh(new T.SphereGeometry(1.78,LOW?40:72,LOW?26:48),
  new T.ShaderMaterial({transparent:true,side:T.BackSide,depthWrite:false,blending:T.AdditiveBlending,
   uniforms:{sunDirW:{value:SUN_DIR}},
   vertexShader:`varying vec3 vN;varying vec3 vP;
    void main(){vN=normalize(mat3(modelMatrix)*normal);
    vec4 wp=modelMatrix*vec4(position,1.);vP=wp.xyz;
    gl_Position=projectionMatrix*viewMatrix*wp;}`,
   fragmentShader:`uniform vec3 sunDirW;varying vec3 vN;varying vec3 vP;
    void main(){vec3 V=normalize(cameraPosition-vP);
     float f=pow(1.-abs(dot(V,normalize(vN))),2.6);
     float s=max(0.,dot(normalize(vN),normalize(sunDirW)));
     vec3 c=mix(vec3(.16,.34,.72),vec3(.45,.68,1.),s);
     gl_FragColor=vec4(c*f*(.35+s*1.15),f*(.30+s*.75));}`}));
 scene.add(atmo);

 // орбитальное кольцо
 ring=new T.Group();
 const ringMesh=new T.Mesh(new T.TorusGeometry(4.6,.028,8,LOW?96:200),
  new T.MeshStandardMaterial({color:0xc9a86a,metalness:1,roughness:.3,
   emissive:0x4a3818,emissiveIntensity:.5,envMapIntensity:1.4}));
 ringMesh.rotation.x=Math.PI/2;ring.add(ringMesh);
 for(let i=0;i<8;i++){
  const a=i/8*TAU;
  const m=new T.Mesh(new T.SphereGeometry(.075,12,10),gold);
  m.position.set(Math.cos(a)*4.6,0,Math.sin(a)*4.6);ring.add(m);
 }
 scene.add(ring);

 // Луна
 const mt=moonTextures(LOW?512:1024);
 const mMat=new T.MeshStandardMaterial({
  map:mk(mt.map,true),bumpMap:mk(mt.bump,false),bumpScale:.055,
  roughness:.94,metalness:0,envMapIntensity:.18});
 moon=new T.Mesh(new T.SphereGeometry(.62,LOW?64:128,LOW?48:96),mMat);
 moon.castShadow=!LOW;moon.receiveShadow=!LOW;
 scene.add(moon);

 // Солнце
 sunMesh=new T.Mesh(new T.SphereGeometry(1.5,32,24),
  new T.MeshBasicMaterial({color:0xffe6b0}));
 sunMesh.position.copy(SUN_DIR).multiplyScalar(34);scene.add(sunMesh);
 const gc=document.createElement('canvas');gc.width=gc.height=256;
 const gx=gc.getContext('2d');
 const gg=gx.createRadialGradient(128,128,0,128,128,128);
 gg.addColorStop(0,'rgba(255,232,180,.95)');gg.addColorStop(.22,'rgba(255,206,138,.42)');
 gg.addColorStop(.55,'rgba(255,180,100,.12)');gg.addColorStop(1,'rgba(255,180,100,0)');
 gx.fillStyle=gg;gx.fillRect(0,0,256,256);
 sunGlow=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(gc),
  transparent:true,blending:T.AdditiveBlending,depthWrite:false,depthTest:false}));
 sunGlow.scale.set(22,22,1);sunGlow.position.copy(sunMesh.position);scene.add(sunGlow);

 // горизонт для вида «с Земли»
 horizonGroup=new T.Group();
 const hillMat=new T.MeshStandardMaterial({color:0x0d0a16,roughness:1,metalness:0});
 const hg=new T.PlaneGeometry(120,40,60,20);
 const hp=hg.attributes.position;
 for(let i=0;i<hp.count;i++){
  const x=hp.getX(i),y=hp.getY(i);
  hp.setZ(i,Math.sin(x*.12)*1.1+Math.sin(x*.31+1.7)*.5+Math.sin(y*.2)*.3);
 }
 hg.computeVertexNormals();
 const hills=new T.Mesh(hg,hillMat);
 hills.rotation.x=-Math.PI/2.35;hills.position.set(0,-4.2,-16);
 horizonGroup.add(hills);
 const dome=new T.Mesh(new T.SphereGeometry(1.05,24,18,0,TAU,0,Math.PI/2),hillMat);
 dome.position.set(6.5,-3.4,-15);horizonGroup.add(dome);
 const domeBase=new T.Mesh(new T.BoxGeometry(2.1,1.1,2.1),hillMat);
 domeBase.position.set(6.5,-4.0,-15);horizonGroup.add(domeBase);
 const minaret=new T.Mesh(new T.CylinderGeometry(.20,.26,4.2,16),hillMat);
 minaret.position.set(9.6,-2.4,-15.5);horizonGroup.add(minaret);
 const cap=new T.Mesh(new T.SphereGeometry(.30,16,12,0,TAU,0,Math.PI/2),hillMat);
 cap.position.set(9.6,-.3,-15.5);horizonGroup.add(cap);
 const wr=mulberry(4242);
 for(let i=0;i<14;i++){
  const wl=new T.Mesh(new T.PlaneGeometry(.16,.24),
   new T.MeshBasicMaterial({color:0xffc46e,transparent:true,opacity:.85}));
  wl.position.set(-14+wr()*28,-3.9+wr()*.7,-13.5-wr()*3);
  horizonGroup.add(wl);
 }
 horizonGroup.visible=false;scene.add(horizonGroup);

 setupPost();
}

/* ── постобработка ── */
function setupPost(){
 const T=THREE;
 const pw=Math.max(2,Math.floor(W*DPR)),ph=Math.max(2,Math.floor(H*DPR));
 const bw=Math.max(2,Math.floor(pw/2)),bh=Math.max(2,Math.floor(ph/2));
 const opt={minFilter:T.LinearFilter,magFilter:T.LinearFilter,format:T.RGBAFormat,
  type:T.HalfFloatType,depthBuffer:true,stencilBuffer:false};
 if(rtScene)rtScene.dispose();if(rtA)rtA.dispose();if(rtB)rtB.dispose();
 rtScene=new T.WebGLRenderTarget(pw,ph,opt);
 rtScene.depthTexture=new T.DepthTexture(pw,ph);
 rtScene.depthTexture.type=T.UnsignedShortType;
 rtA=new T.WebGLRenderTarget(bw,bh,{...opt,depthBuffer:false});
 rtB=new T.WebGLRenderTarget(bw,bh,{...opt,depthBuffer:false});
 quadCam=new T.OrthographicCamera(-1,1,1,-1,0,1);
 const geo=new T.PlaneGeometry(2,2);
 matBright=new T.ShaderMaterial({uniforms:{tDiffuse:{value:null},threshold:{value:.72}},
  vertexShader:VS,fragmentShader:FS_BRIGHT,depthTest:false,depthWrite:false});
 matBlur=new T.ShaderMaterial({uniforms:{tDiffuse:{value:null},dir:{value:new T.Vector2()}},
  vertexShader:VS,fragmentShader:FS_BLUR,depthTest:false,depthWrite:false});
 matComp=new T.ShaderMaterial({uniforms:{
  tScene:{value:null},tBloom:{value:null},tDepth:{value:null},
  res:{value:new T.Vector2(pw,ph)},time:{value:0},
  grain:{value:LOW?.020:.030},vignette:{value:.42},chroma:{value:.0032},
  bloomK:{value:.85},dofK:{value:LOW?0:.85},focus:{value:13.5},
  near:{value:camera.near},far:{value:camera.far}},
  vertexShader:VS,fragmentShader:FS_COMP,depthTest:false,depthWrite:false});
 quad=new T.Mesh(geo,matComp);
}
function pass(mat,target){quad.material=mat;renderer.setRenderTarget(target);
 renderer.clear();renderer.render(quad,quadCam);}

function renderFrame(t){
 const T=THREE;
 // позиции
 const rad=angle*D2R;
 const orbitR=4.6*(1+explode*.55);
 moon.position.set(-Math.cos(rad)*orbitR,explode*1.4,-Math.sin(rad)*orbitR);
 moon.rotation.y=-rad+Math.PI;
 earth.position.y=explode*2.6;
 clouds.position.copy(earth.position);
 atmo.position.copy(earth.position);
 clouds.rotation.y+=0.00035;
 earth.rotation.y+=0.00012;
 ring.position.y=-explode*1.2;
 base.position.y=-explode*2.2;
 stand.position.y=-explode*1.0;
 ring.scale.setScalar(1+explode*.55);

 // камера
 const e=viewT<.5?2*viewT*viewT:1-Math.pow(-2*viewT+2,2)/2;
 const orbPos=new T.Vector3(
  Math.sin(camPhi)*Math.cos(camTheta)*camDist,
  Math.cos(camPhi)*camDist,
  Math.sin(camPhi)*Math.sin(camTheta)*camDist);
 const groundPos=new T.Vector3(0,-2.6,7.2);
 const pos=orbPos.clone().lerp(groundPos,e);
 camera.position.copy(pos);
 const orbTarget=new T.Vector3(0,0,0);
 const groundTarget=moon.position.clone().multiplyScalar(.55).add(new T.Vector3(0,1.2,0));
 camera.lookAt(orbTarget.lerp(groundTarget,e));
 camera.fov=42-e*10;camera.updateProjectionMatrix();

 horizonGroup.visible=e>.02;
 horizonGroup.traverse(o=>{if(o.material&&o.material.opacity!==undefined&&o.material.transparent)
  o.material.opacity=.85*e;});
 stars.rotation.y+=0.00004;
 sunGlow.scale.setScalar(20+Math.sin(t*.0008)*.8);

 matComp.uniforms.focus.value=pos.length()*(1-e)+moon.position.distanceTo(pos)*e;
 matComp.uniforms.time.value=t*.001;
 matComp.uniforms.dofK.value=LOW?0:(.55+e*.9);

 renderer.setRenderTarget(rtScene);renderer.clear();renderer.render(scene,camera);
 matBright.uniforms.tDiffuse.value=rtScene.texture;pass(matBright,rtA);
 const bw=rtA.width,bh=rtA.height;
 for(let i=0;i<2;i++){
  const s=1+i*1.6;
  matBlur.uniforms.tDiffuse.value=rtA.texture;matBlur.uniforms.dir.value.set(s/bw,0);pass(matBlur,rtB);
  matBlur.uniforms.tDiffuse.value=rtB.texture;matBlur.uniforms.dir.value.set(0,s/bh);pass(matBlur,rtA);
 }
 matComp.uniforms.tScene.value=rtScene.texture;
 matComp.uniforms.tBloom.value=rtA.texture;
 matComp.uniforms.tDepth.value=rtScene.depthTexture;
 renderer.setRenderTarget(null);pass(matComp,null);
}

/* ── UI ── */
const sl=$('sl'),playBtn=$('play'),spdBtn=$('spd'),camBtn=$('cam'),expBtn=$('exp'),chips=$('chips');
PHASES.forEach(p=>{const b=document.createElement('button');b.textContent=p.s;
 b.onclick=()=>{stop();tween={f:angle,to:p.a,t:0};};chips.appendChild(b);});
function litFrac(a){return (1-Math.cos(a*D2R))/2;}
function phaseOf(a){return PHASES[Math.round(((a%360)+360)%360/45)%8];}
function syncText(){
 const p=phaseOf(angle);
 $('pname').textContent=p.s;$('pexp').textContent=p.t;
 $('fday').textContent=(angle/360*MONTH).toFixed(1).replace('.',',');
 $('flit').textContent=Math.round(litFrac(angle)*100)+'%';
 for(let i=0;i<chips.children.length;i++)chips.children[i].className=PHASES[i].s===p.s?'on':'';
 $('mode').innerHTML=viewT>.5?'Вид с Земли<br><span style="opacity:.6">двойной тап — назад</span>'
  :'Орбита<br><span style="opacity:.6">облёт пальцем</span>';
 camBtn.textContent=viewT>.5?'Орбита':'С Земли';camBtn.className=viewT>.5?'on':'';
 expBtn.className=explodeT>.5?'on':'';
}
function stop(){playing=false;playBtn.textContent='▶ Пуск';playBtn.className='';}
playBtn.onclick=()=>{tween=null;playing=!playing;
 playBtn.textContent=playing?'⏸ Пауза':'▶ Пуск';playBtn.className=playing?'on':'';last=0;};
spdBtn.onclick=()=>{si=(si+1)%CONFIG.speeds.length;spdBtn.textContent=CONFIG.speeds[si]+'×';};
camBtn.onclick=()=>{view=viewT>.5?0:1;};
expBtn.onclick=()=>{explode=explodeT>.5?0:1;};
sl.oninput=()=>{stop();tween=null;angle=parseFloat(sl.value);syncText();};
$('q').onclick=()=>{
 QMODE=QMODE==='auto'?'high':(QMODE==='high'?'low':'auto');
 $('q').textContent='Качество: '+(QMODE==='auto'?'авто':QMODE==='high'?'высокое':'эконом');
 applyQuality();resize();setupPost();
};
function applyQuality(){
 LOW = QMODE==='low' || (QMODE==='auto' &&
  ((navigator.hardwareConcurrency||4)<=4 || Math.min(screen.width,screen.height)<380));
 DPR=Math.min(window.devicePixelRatio||1,LOW?1.25:2);
}

/* ── жесты ── */
const ptr=new Map();let pinch0=0,dist0=0,lastTap=0,px0=0,py0=0,th0=0,ph0=0,moved=0;
const stage=$('stage');
stage.addEventListener('pointerdown',e=>{
 stage.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptr.size===1){px0=e.clientX;py0=e.clientY;th0=camTheta;ph0=camPhi;moved=0;
  const now=performance.now();if(now-lastTap<300)view=viewT>.5?0:1;lastTap=now;}
 if(ptr.size===2){const p=[...ptr.values()];pinch0=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);dist0=camDist;}
});
stage.addEventListener('pointermove',e=>{
 if(!ptr.has(e.pointerId))return;
 ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptr.size>=2&&pinch0>0){
  const p=[...ptr.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
  camDist=Math.max(4.5,Math.min(30,dist0*(pinch0/d)));
 } else if(ptr.size===1){
  const dx=e.clientX-px0,dy=e.clientY-py0;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
  if(moved>5){camTheta=th0-dx*.006;camPhi=Math.max(.22,Math.min(2.5,ph0-dy*.005));}
 }
});
function up(e){ptr.delete(e.pointerId);if(ptr.size<2)pinch0=0;}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);

/* ── размеры и цикл ── */
function resize(){
 W=Math.round(window.innerWidth);H=Math.round(window.innerHeight);
 if(!renderer)return;
 renderer.setPixelRatio(DPR);renderer.setSize(W,H,false);
 camera.aspect=W/H;camera.updateProjectionMatrix();
}
window.addEventListener('resize',()=>{resize();setupPost();});
window.addEventListener('orientationchange',()=>setTimeout(()=>{resize();setupPost();},250));

function loop(t){
 if(!last)last=t;const dt=Math.min((t-last)/1000,.05);last=t;
 if(Math.abs(viewT-view)>.001)viewT+=(view-viewT)*Math.min(1,dt*5);
 if(Math.abs(explodeT-explode)>.001)explodeT+=(explode-explodeT)*Math.min(1,dt*5);
 if(tween){tween.t+=dt*1000;const k=Math.min(tween.t/CONFIG.jumpMs,1);
  const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  const d=((tween.to-tween.f+540)%360)-180;
  angle=(tween.f+d*e+360)%360;sl.value=angle.toFixed(1);syncText();if(k>=1)tween=null;}
 else if(playing){angle=(angle+dt*360/CONFIG.cycleSec*CONFIG.speeds[si])%360;
  sl.value=angle.toFixed(1);syncText();}
 renderFrame(t);requestAnimationFrame(loop);
}

/* ── офлайн-экспорт ── */
$('dl').onclick=async()=>{
 const src=window.__THREE_SRC__||localStorage.getItem('three_src');
 if(!src){alert('Движок ещё не загружен. Откройте страницу с интернетом один раз.');return;}
 let html=document.documentElement.outerHTML;
 const inject='<script>'+src.replace(/<\/script/gi,'<\\/script')+'<\/script>';
 html=html.replace('<script>\n/* ══════════ НАСТРОЙКИ',inject+'\n<script>\n/* ══════════ НАСТРОЙКИ');
 const blob=new Blob([html],{type:'text/html'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download='moon-lab-offline.html';
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),4000);
};

/* ── старт ── */
(async function(){
 applyQuality();
 W=Math.round(window.innerWidth);H=Math.round(window.innerHeight);
 bf.style.width='8%';
 const ok=await loadThree();
 if(!ok){
  bt.textContent='Нет соединения';
  be.style.display='block';
  be.innerHTML='Для первого запуска нужен интернет — движок 3D весит около 600 КБ и загружается один раз. Подключитесь к сети и обновите страницу. После загрузки модель работает офлайн.';
  return;
 }
 bf.style.width='35%';bt.textContent='Собираем Луну';
 await new Promise(r=>setTimeout(r,50));
 try{
  build();
  bf.style.width='92%';bt.textContent='Настраиваем свет';
  await new Promise(r=>setTimeout(r,40));
  syncText();resize();
  requestAnimationFrame(loop);
  bf.style.width='100%';
  const b=$('boot');b.style.opacity='0';setTimeout(()=>b.remove(),650);
 }catch(err){
  bt.textContent='Ошибка сборки';be.style.display='block';
  be.textContent=String(err&&err.message||err)+'. Попробуйте переключить качество на «эконом» или открыть в Safari.';
 }
})();
</script>
